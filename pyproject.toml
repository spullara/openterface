[project]
name = "kvmuse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "pillow>=13.0.0",
    "pyserial>=3.5",
]
[dependency-groups]
dev = ["pytest>=8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kvmuse-mcp = "kvmuse.server:main"
